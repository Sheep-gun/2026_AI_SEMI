<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
  <title id="title">P7-GE elastic Gray-epoch AER controller</title>
  <desc id="desc">비동기 source 요청을 2FF로 동기화하고 source별 pending bit에 조기 접수한 뒤 Gray-epoch XOR tournament로 공정하게 선택하여 등록된 단일 주소 버스로 전달하는 구조</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#ea580c"/>
    </marker>
    <filter id="shadow" x="-12%" y="-18%" width="124%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <style>
      .title { font:700 34px 'Noto Sans KR','Malgun Gothic',sans-serif; fill:#0f172a; }
      .subtitle { font:400 18px 'Noto Sans KR','Malgun Gothic',sans-serif; fill:#475569; }
      .block-title { font:700 20px 'Noto Sans KR','Malgun Gothic',sans-serif; fill:#0f172a; }
      .body { font:400 16px 'Noto Sans KR','Malgun Gothic',sans-serif; fill:#334155; }
      .small { font:400 14px 'Noto Sans KR','Malgun Gothic',sans-serif; fill:#475569; }
      .signal { font:700 14px Consolas,'Noto Sans KR',monospace; fill:#0f172a; }
      .flow { stroke:#2563eb; stroke-width:3; fill:none; marker-end:url(#arrow-blue); }
      .ack { stroke:#0f766e; stroke-width:3; fill:none; marker-end:url(#arrow-teal); }
      .state { stroke:#ea580c; stroke-width:3; fill:none; marker-end:url(#arrow-orange); }
    </style>
  </defs>

  <rect width="1600" height="930" fill="#f8fafc"/>
  <text x="55" y="58" class="title">P7-GE: Elastic Gray-epoch AER 컨트롤러</text>
  <text x="55" y="90" class="subtitle">P4-C의 pending 16 slots·registered output·조기 ACK를 유지하고, 10-bit 계층형 pointer를 4-bit Gray epoch로 교체</text>

  <!-- Main left-to-right datapath. -->
  <g filter="url(#shadow)"><rect x="45" y="215" width="195" height="300" rx="20" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/></g>
  <text x="142" y="258" text-anchor="middle" class="block-title">비동기 source 16개</text>
  <text x="142" y="287" text-anchor="middle" class="small">source별 4-phase 요청</text>
  <rect x="78" y="330" width="130" height="50" rx="10" fill="#fff" stroke="#5eead4"/>
  <rect x="78" y="400" width="130" height="50" rx="10" fill="#fff" stroke="#5eead4"/>
  <text x="143" y="361" text-anchor="middle" class="signal">src_req[15:0]</text>
  <text x="143" y="431" text-anchor="middle" class="signal">src_ack[15:0]</text>
  <text x="142" y="480" text-anchor="middle" class="small">ACK 전까지 REQ 유지</text>

  <g filter="url(#shadow)"><rect x="285" y="245" width="180" height="240" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/></g>
  <text x="375" y="288" text-anchor="middle" class="block-title">2FF CDC</text>
  <rect x="322" y="330" width="48" height="62" rx="8" fill="#fff" stroke="#93c5fd"/>
  <rect x="393" y="330" width="48" height="62" rx="8" fill="#fff" stroke="#93c5fd"/>
  <text x="346" y="367" text-anchor="middle" class="signal">FF1</text>
  <text x="417" y="367" text-anchor="middle" class="signal">FF2</text>
  <path d="M370 361 H386" class="flow"/>
  <text x="375" y="427" text-anchor="middle" class="body">안정된 req_sync만</text>
  <text x="375" y="453" text-anchor="middle" class="body">중재기에 전달</text>

  <g filter="url(#shadow)"><rect x="515" y="205" width="235" height="320" rx="18" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/></g>
  <text x="632" y="248" text-anchor="middle" class="block-title">조기 접수 + 내부 대기칸</text>
  <text x="632" y="278" text-anchor="middle" class="small">pending_d / pending_q [15:0]</text>
  <g fill="#fff" stroke="#5eead4">
    <rect x="558" y="320" width="30" height="30" rx="5"/><rect x="602" y="320" width="30" height="30" rx="5"/>
    <rect x="646" y="320" width="30" height="30" rx="5"/><rect x="690" y="320" width="30" height="30" rx="5"/>
    <rect x="558" y="364" width="30" height="30" rx="5"/><rect x="602" y="364" width="30" height="30" rx="5"/>
    <rect x="646" y="364" width="30" height="30" rx="5"/><rect x="690" y="364" width="30" height="30" rx="5"/>
    <rect x="558" y="408" width="30" height="30" rx="5"/><rect x="602" y="408" width="30" height="30" rx="5"/>
    <rect x="646" y="408" width="30" height="30" rx="5"/><rect x="690" y="408" width="30" height="30" rx="5"/>
    <rect x="558" y="444" width="30" height="30" rx="5"/><rect x="602" y="444" width="30" height="30" rx="5"/>
    <rect x="646" y="444" width="30" height="30" rx="5"/><rect x="690" y="444" width="30" height="30" rx="5"/>
  </g>
  <text x="632" y="493" text-anchor="middle" class="body">source별 pending 16 slots</text>
  <text x="632" y="514" text-anchor="middle" class="small">접수와 같은 decision에서 중재 후보</text>

  <g filter="url(#shadow)"><rect x="810" y="185" width="285" height="360" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="2"/></g>
  <text x="952" y="230" text-anchor="middle" class="block-title">Gray-epoch XOR tournament</text>
  <text x="952" y="260" text-anchor="middle" class="small">candidate 중 source XOR Gray(epoch)가 최소인 주소</text>
  <g stroke="#fb923c" stroke-width="2" fill="#fff">
    <rect x="850" y="305" width="205" height="42" rx="10"/>
    <rect x="870" y="373" width="165" height="42" rx="10"/>
    <rect x="890" y="441" width="125" height="42" rx="10"/>
  </g>
  <text x="952" y="332" text-anchor="middle" class="body">8 pair → 4 quarter</text>
  <text x="952" y="400" text-anchor="middle" class="body">4 quarter → 2 half</text>
  <text x="952" y="468" text-anchor="middle" class="body">선호 branch를 4단 선택</text>
  <path d="M952 347 V365" class="state"/>
  <path d="M952 415 V433" class="state"/>
  <text x="952" y="510" text-anchor="middle" class="small">지속 pending: 최대 16 service decisions</text>
  <text x="952" y="532" text-anchor="middle" class="small">grant≠clock · receiver stall 시간 제외</text>

  <g filter="url(#shadow)"><rect x="1155" y="245" width="190" height="240" rx="18" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/></g>
  <text x="1250" y="288" text-anchor="middle" class="block-title">등록된 출력</text>
  <rect x="1196" y="330" width="108" height="78" rx="10" fill="#fff" stroke="#a5b4fc"/>
  <text x="1250" y="361" text-anchor="middle" class="signal">addr[3:0]</text>
  <text x="1250" y="389" text-anchor="middle" class="signal">valid / ready</text>
  <text x="1250" y="447" text-anchor="middle" class="body">stall 동안 주소 고정</text>

  <g filter="url(#shadow)"><rect x="1400" y="275" width="155" height="180" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/></g>
  <text x="1477" y="320" text-anchor="middle" class="block-title">수신기</text>
  <text x="1477" y="356" text-anchor="middle" class="signal">4-bit 주소 버스</text>
  <text x="1477" y="386" text-anchor="middle" class="body">최대</text>
  <text x="1477" y="414" text-anchor="middle" class="body">1 event/clock</text>

  <path d="M240 355 H270" class="flow"/>
  <path d="M465 355 H500" class="flow"/>
  <path d="M750 355 H795" class="flow"/>
  <path d="M1095 355 H1140" class="flow"/>
  <path d="M1345 355 H1385" class="flow"/>
  <text x="255" y="335" text-anchor="middle" class="signal">req</text>
  <text x="482" y="335" text-anchor="middle" class="signal">sync</text>
  <text x="772" y="335" text-anchor="middle" class="signal">pending</text>
  <text x="1117" y="335" text-anchor="middle" class="signal">winner</text>

  <!-- Early acknowledge returns from the controller-resident pending store. -->
  <path d="M590 525 V580 H142 V530" class="ack"/>
  <rect x="260" y="553" width="300" height="54" rx="12" fill="#ecfdf5" stroke="#5eead4"/>
  <text x="410" y="577" text-anchor="middle" class="block-title">Early ACK</text>
  <text x="410" y="598" text-anchor="middle" class="small">pending 16 + output 1 = 최대 17 accepted</text>

  <!-- Gray epoch state and robust reset. -->
  <g filter="url(#shadow)"><rect x="835" y="610" width="235" height="100" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/></g>
  <text x="952" y="647" text-anchor="middle" class="block-title">4-bit epoch state</text>
  <text x="952" y="676" text-anchor="middle" class="signal">gray = epoch XOR (epoch&gt;&gt;1)</text>
  <text x="952" y="699" text-anchor="middle" class="small">grant마다 +1 · full backlog는 1-bit Gray 순서</text>
  <path d="M952 610 V562" class="state"/>
  <path d="M1095 430 C1125 430 1125 660 1078 660" class="state"/>

  <g filter="url(#shadow)"><rect x="585" y="630" width="175" height="80" rx="15" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/></g>
  <text x="672" y="662" text-anchor="middle" class="block-title">Reset release 2FF</text>
  <text x="672" y="689" text-anchor="middle" class="small">비동기 assert · 동기 deassert</text>
  <path d="M672 630 V548" class="flow"/>

  <!-- Bottom comparison cards. -->
  <text x="55" y="780" class="block-title">P4-C와 동일하게 유지한 것</text>
  <rect x="50" y="805" width="710" height="90" rx="15" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="78" y="840" class="body">2FF CDC · source별 pending 16개 · 조기 ACK · registered valid/ready · 단일 4-bit 버스</text>
  <text x="78" y="872" class="small">따라서 저장공간을 source 쪽으로 떠넘기지 않고 stall 흡수 능력과 peak 처리율을 그대로 보존</text>

  <text x="820" y="780" class="block-title">새로 개선한 것</text>
  <rect x="815" y="805" width="735" height="90" rx="15" fill="#fff7ed" stroke="#fb923c"/>
  <text x="843" y="840" class="body">계층형 RR 10 FF → Gray epoch 4 FF · full backlog 주소 전환 1 bit/event</text>
  <text x="843" y="872" class="small">공정성 상한 16 service decisions(stall 제외)와 함께 logic, cell area, clocked state, 주소 switching 감소</text>
</svg>
