<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">T0-PPA 전통적 비동기 AER baseline 구조</title>
  <desc id="desc">16개 이벤트 소스 중 하나를 고정 우선순위로 고르고, characterized latch에 주소를 보관하며, delay cell로 bundled-data margin을 확보한 clockless AER baseline 블록도</desc>

  <defs>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c2410c"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-12%" y="-18%" width="124%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px 'Noto Sans KR', 'Malgun Gothic', sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px 'Noto Sans KR', 'Malgun Gothic', sans-serif; fill: #475569; }
      .group-title { font: 700 23px 'Noto Sans KR', 'Malgun Gothic', sans-serif; fill: #0f172a; }
      .block-title { font: 700 19px 'Noto Sans KR', 'Malgun Gothic', sans-serif; fill: #0f172a; }
      .body { font: 400 16px 'Noto Sans KR', 'Malgun Gothic', sans-serif; fill: #334155; }
      .small { font: 400 14px 'Noto Sans KR', 'Malgun Gothic', sans-serif; fill: #475569; }
      .signal { font: 700 16px Consolas, 'Noto Sans KR', monospace; fill: #0f172a; }
      .state { font: 700 13px Consolas, monospace; fill: #334155; }
      .teal { stroke: #0f766e; stroke-width: 3; fill: none; marker-end: url(#arrow-teal); }
      .blue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .orange { stroke: #c2410c; stroke-width: 3; fill: none; marker-end: url(#arrow-orange); }
      .gray { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow-gray); }
    </style>
  </defs>

  <rect width="1500" height="900" fill="#f8fafc"/>
  <text x="60" y="58" class="title">T0-PPA 전통적 비동기 AER Baseline</text>
  <text x="60" y="90" class="subtitle">공통 clock 없음 · TLAT latch · DLY4 relative delay · 고정 우선순위 · 4-phase handshake</text>

  <!-- Sources -->
  <g filter="url(#shadow)">
    <rect x="55" y="165" width="275" height="455" rx="20" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  </g>
  <text x="192" y="205" text-anchor="middle" class="group-title">이벤트 소스 16개</text>
  <text x="192" y="232" text-anchor="middle" class="small">응답을 받을 때까지 요청을 유지</text>

  <rect x="92" y="270" width="200" height="58" rx="11" fill="#ffffff" stroke="#5eead4"/>
  <rect x="92" y="342" width="200" height="58" rx="11" fill="#ffffff" stroke="#5eead4"/>
  <rect x="92" y="472" width="200" height="58" rx="11" fill="#ffffff" stroke="#5eead4"/>
  <rect x="92" y="544" width="200" height="58" rx="11" fill="#ffffff" stroke="#5eead4"/>
  <text x="192" y="306" text-anchor="middle" class="block-title">source 0 · 먼저 선택</text>
  <text x="192" y="378" text-anchor="middle" class="block-title">source 1</text>
  <text x="192" y="442" text-anchor="middle" class="group-title">⋮</text>
  <text x="192" y="508" text-anchor="middle" class="block-title">source 14</text>
  <text x="192" y="572" text-anchor="middle" class="block-title">source 15</text>
  <text x="192" y="594" text-anchor="middle" class="small">가장 늦게 선택</text>

  <!-- Controller -->
  <g filter="url(#shadow)">
    <rect x="405" y="125" width="790" height="570" rx="22" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/>
  </g>
  <text x="800" y="166" text-anchor="middle" class="group-title">T0-PPA clockless AER 컨트롤러</text>
  <text x="800" y="193" text-anchor="middle" class="small">characterized latch/delay cell · 요청과 응답 신호의 변화로 다음 단계 진행</text>

  <!-- Controller datapath blocks -->
  <rect x="455" y="245" width="220" height="130" rx="15" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="565" y="283" text-anchor="middle" class="block-title">고정 우선순위</text>
  <text x="565" y="307" text-anchor="middle" class="block-title">선택기</text>
  <text x="565" y="338" text-anchor="middle" class="body">번호가 작은 요청부터 선택</text>
  <text x="565" y="361" text-anchor="middle" class="small">동시 요청 시 source 0부터 확인</text>

  <rect x="735" y="245" width="180" height="130" rx="15" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="825" y="286" text-anchor="middle" class="block-title">TLAT 주소 래치</text>
  <text x="825" y="321" text-anchor="middle" class="signal">grant_q[3:0]</text>
  <text x="825" y="350" text-anchor="middle" class="small">전송이 끝날 때까지 주소 기억</text>

  <rect x="975" y="245" width="170" height="130" rx="15" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="1060" y="283" text-anchor="middle" class="block-title">출력 신호 생성</text>
  <text x="1060" y="316" text-anchor="middle" class="signal">aer_addr</text>
  <text x="1060" y="341" text-anchor="middle" class="signal">aer_req</text>
  <text x="1060" y="366" text-anchor="middle" class="signal">src_ack</text>

  <!-- Clean datapath arrows -->
  <path d="M330 300 H440" class="teal"/>
  <text x="385" y="283" text-anchor="middle" class="signal">src_req[15:0]</text>
  <path d="M675 310 H720" class="orange"/>
  <text x="698" y="292" text-anchor="middle" class="small">index</text>
  <path d="M915 310 H960" class="blue"/>
  <text x="938" y="292" text-anchor="middle" class="small">grant</text>

  <!-- Clockless handshake control -->
  <rect x="495" y="465" width="610" height="145" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="800" y="495" text-anchor="middle" class="block-title">DLY4 margin을 둔 clockless 4-phase 제어</text>

  <rect x="520" y="520" width="110" height="48" rx="9" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="665" y="520" width="125" height="48" rx="9" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="825" y="520" width="125" height="48" rx="9" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="985" y="520" width="95" height="48" rx="9" fill="#ffffff" stroke="#94a3b8"/>
  <text x="575" y="549" text-anchor="middle" class="state">대기</text>
  <text x="727" y="541" text-anchor="middle" class="state">수신 응답</text>
  <text x="727" y="557" text-anchor="middle" class="state">기다림</text>
  <text x="887" y="541" text-anchor="middle" class="state">뉴런 요청</text>
  <text x="887" y="557" text-anchor="middle" class="state">종료 기다림</text>
  <text x="1032" y="541" text-anchor="middle" class="state">수신 응답</text>
  <text x="1032" y="557" text-anchor="middle" class="state">종료 기다림</text>
  <path d="M630 544 H650" class="gray"/>
  <path d="M790 544 H810" class="gray"/>
  <path d="M950 544 H970" class="gray"/>
  <path d="M1032 568 V590 H575 V583" class="gray"/>

  <!-- Handshake inputs/control without crossings -->
  <path d="M385 300 V440 H470 V575 H495" class="teal"/>
  <text x="435" y="425" text-anchor="middle" class="small">selected source release</text>
  <path d="M1060 465 V390" class="gray"/>
  <text x="1080" y="430" class="small">busy 상태</text>

  <!-- Receiver -->
  <g filter="url(#shadow)">
    <rect x="1270" y="225" width="200" height="290" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  </g>
  <text x="1370" y="267" text-anchor="middle" class="group-title">수신기</text>
  <text x="1370" y="294" text-anchor="middle" class="small">이벤트를 받는 회로</text>
  <rect x="1300" y="330" width="140" height="62" rx="11" fill="#ffffff" stroke="#93c5fd"/>
  <rect x="1300" y="420" width="140" height="62" rx="11" fill="#ffffff" stroke="#93c5fd"/>
  <text x="1370" y="368" text-anchor="middle" class="block-title">주소 캡처</text>
  <text x="1370" y="458" text-anchor="middle" class="block-title">ACK 응답</text>

  <!-- Receiver-facing link -->
  <path d="M1145 285 H1255" class="blue"/>
  <text x="1200" y="268" text-anchor="middle" class="signal">aer_addr[3:0]</text>
  <path d="M1145 345 H1255" class="blue"/>
  <text x="1200" y="328" text-anchor="middle" class="signal">aer_req</text>
  <path d="M1270 470 H1205 V635 H1130 V575 H1105" class="blue"/>
  <text x="1185" y="657" text-anchor="middle" class="signal">aer_ack</text>

  <!-- Source acknowledge return -->
  <path d="M975 365 V665 H365 V520 H330" class="teal"/>
  <text x="650" y="687" text-anchor="middle" class="signal">src_ack[15:0]</text>

  <!-- Four concise bottleneck cards -->
  <text x="60" y="765" class="group-title">T0-PPA에 남겨 둔 전통적 한계</text>
  <rect x="55" y="790" width="320" height="72" rx="13" fill="#fff7ed" stroke="#fb923c"/>
  <rect x="405" y="790" width="320" height="72" rx="13" fill="#fff7ed" stroke="#fb923c"/>
  <rect x="755" y="790" width="320" height="72" rx="13" fill="#fff7ed" stroke="#fb923c"/>
  <rect x="1105" y="790" width="340" height="72" rx="13" fill="#fff7ed" stroke="#fb923c"/>
  <text x="215" y="820" text-anchor="middle" class="block-title">고정된 처리 순서</text>
  <text x="215" y="846" text-anchor="middle" class="body">큰 번호 뉴런이 오래 기다릴 수 있음</text>
  <text x="565" y="820" text-anchor="middle" class="block-title">이벤트 저장 공간 없음</text>
  <text x="565" y="846" text-anchor="middle" class="body">한꺼번에 몰린 요청을 보관하지 못함</text>
  <text x="915" y="820" text-anchor="middle" class="block-title">매번 신호를 원위치</text>
  <text x="915" y="846" text-anchor="middle" class="body">다음 전송 전 정리 시간이 필요</text>
  <text x="1275" y="820" text-anchor="middle" class="block-title">공유 통로 1개</text>
  <text x="1275" y="846" text-anchor="middle" class="body">수신기가 멈추면 전체가 기다림</text>
</svg>
