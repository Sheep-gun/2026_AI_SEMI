<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-labelledby="title desc">
  <title id="title">P4-C cut-through AER controller structure</title>
  <desc id="desc">비동기 뉴런 요청을 2단 동기화한 뒤 pending next-state 기록과 같은 결정에서 바로 round-robin 후보로 사용해 한 cycle 대기를 제거하는 구조</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#2563eb"/>
    </marker>
    <marker id="fast-arrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#f97316"/>
    </marker>
    <filter id="shadow" x="-12%" y="-18%" width="124%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px 'Noto Sans KR','Malgun Gothic',sans-serif; fill:#0f172a; }
      .subtitle { font: 400 18px 'Noto Sans KR','Malgun Gothic',sans-serif; fill:#475569; }
      .block-title { font: 700 20px 'Noto Sans KR','Malgun Gothic',sans-serif; fill:#0f172a; }
      .body { font: 400 16px 'Noto Sans KR','Malgun Gothic',sans-serif; fill:#334155; }
      .small { font: 400 14px 'Noto Sans KR','Malgun Gothic',sans-serif; fill:#475569; }
      .signal { font: 700 15px Consolas,'Noto Sans KR',monospace; fill:#0f172a; }
      .flow { stroke:#2563eb; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .fast { stroke:#f97316; stroke-width:4; fill:none; stroke-dasharray:10 7; marker-end:url(#fast-arrow); }
    </style>
  </defs>
  <rect width="1500" height="780" fill="#f8fafc"/>
  <text x="60" y="58" class="title">P4-C Cut-through AER 컨트롤러</text>
  <text x="60" y="90" class="subtitle">새 event를 pending register에서 한 cycle 더 기다리지 않고 같은 next-state decision에서 바로 선택</text>

  <g filter="url(#shadow)"><rect x="55" y="215" width="220" height="280" rx="20" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/></g>
  <text x="165" y="258" text-anchor="middle" class="block-title">비동기 뉴런 16개</text>
  <text x="165" y="287" text-anchor="middle" class="small">source별 4-phase 요청·응답</text>
  <rect x="87" y="330" width="156" height="48" rx="10" fill="#fff" stroke="#5eead4"/>
  <rect x="87" y="398" width="156" height="48" rx="10" fill="#fff" stroke="#5eead4"/>
  <text x="165" y="360" text-anchor="middle" class="body">src_req[15:0]</text>
  <text x="165" y="428" text-anchor="middle" class="body">src_ack[15:0]</text>

  <g filter="url(#shadow)"><rect x="340" y="245" width="190" height="220" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/></g>
  <text x="435" y="287" text-anchor="middle" class="block-title">2FF 동기화</text>
  <rect x="380" y="330" width="46" height="58" rx="8" fill="#fff" stroke="#93c5fd"/>
  <rect x="446" y="330" width="46" height="58" rx="8" fill="#fff" stroke="#93c5fd"/>
  <text x="403" y="365" text-anchor="middle" class="signal">FF1</text>
  <text x="469" y="365" text-anchor="middle" class="signal">FF2</text>
  <path d="M426 359 H440" class="flow"/>
  <text x="435" y="423" text-anchor="middle" class="body">clock domain으로</text>
  <text x="435" y="446" text-anchor="middle" class="body">안전하게 인계</text>

  <g filter="url(#shadow)"><rect x="595" y="215" width="220" height="280" rx="18" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/></g>
  <text x="705" y="258" text-anchor="middle" class="block-title">접수 + 대기칸</text>
  <text x="705" y="287" text-anchor="middle" class="small">pending_d / pending_q</text>
  <g fill="#fff" stroke="#5eead4">
    <rect x="635" y="330" width="30" height="30" rx="5"/><rect x="675" y="330" width="30" height="30" rx="5"/>
    <rect x="715" y="330" width="30" height="30" rx="5"/><rect x="755" y="330" width="30" height="30" rx="5"/>
    <rect x="635" y="372" width="30" height="30" rx="5"/><rect x="675" y="372" width="30" height="30" rx="5"/>
    <rect x="715" y="372" width="30" height="30" rx="5"/><rect x="755" y="372" width="30" height="30" rx="5"/>
  </g>
  <text x="705" y="440" text-anchor="middle" class="body">source마다 event 1개</text>
  <text x="705" y="465" text-anchor="middle" class="body">총 16개 decoupling</text>

  <g filter="url(#shadow)"><rect x="885" y="215" width="235" height="280" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="2"/></g>
  <text x="1002" y="258" text-anchor="middle" class="block-title">4×4 Round-robin</text>
  <text x="1002" y="287" text-anchor="middle" class="small">4개 local 후보를 병렬 계산</text>
  <circle cx="1002" cy="365" r="60" fill="#fff" stroke="#fb923c" stroke-width="2"/>
  <text x="1002" y="355" text-anchor="middle" class="signal">G0 → G1</text>
  <text x="1002" y="383" text-anchor="middle" class="signal">G3 ← G2</text>
  <text x="1002" y="447" text-anchor="middle" class="body">동일한 공정성·순서</text>
  <text x="1002" y="471" text-anchor="middle" class="body">starvation 방지</text>

  <g filter="url(#shadow)"><rect x="1190" y="245" width="190" height="220" rx="18" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/></g>
  <text x="1285" y="287" text-anchor="middle" class="block-title">등록된 출력</text>
  <rect x="1235" y="330" width="100" height="72" rx="10" fill="#fff" stroke="#a5b4fc"/>
  <text x="1285" y="359" text-anchor="middle" class="signal">addr[3:0]</text>
  <text x="1285" y="385" text-anchor="middle" class="signal">valid/ready</text>
  <text x="1285" y="437" text-anchor="middle" class="body">최대 1 event/clock</text>

  <path d="M275 355 H325" class="flow"/><path d="M530 355 H580" class="flow"/>
  <path d="M815 355 H870" class="flow"/><path d="M1120 355 H1175" class="flow"/>
  <text x="300" y="336" text-anchor="middle" class="signal">req</text>
  <text x="555" y="336" text-anchor="middle" class="signal">sync</text>
  <text x="842" y="336" text-anchor="middle" class="signal">pending</text>
  <text x="1147" y="336" text-anchor="middle" class="signal">winner</text>

  <!-- Cut-through bypass: pending next-state is a candidate immediately. -->
  <path d="M705 310 C730 145 920 145 965 205" class="fast"/>
  <rect x="716" y="125" width="260" height="58" rx="13" fill="#fff7ed" stroke="#fb923c"/>
  <text x="846" y="150" text-anchor="middle" class="block-title">Cut-through 경로</text>
  <text x="846" y="173" text-anchor="middle" class="small">접수와 같은 decision에서 후보 등록</text>

  <text x="60" y="590" class="block-title">고정 지연 한 cycle을 제거하는 방법</text>
  <rect x="55" y="620" width="650" height="110" rx="15" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="85" y="653" class="block-title">P3</text>
  <text x="160" y="653" class="body">동기화 → pending_q 기록 → 다음 cycle 선택 → 출력</text>
  <text x="160" y="689" class="small">새 event가 idle output에 도달하기 전에 pending register cycle이 반드시 존재</text>

  <rect x="745" y="620" width="700" height="110" rx="15" fill="#fff7ed" stroke="#fb923c"/>
  <text x="775" y="653" class="block-title">P4-C</text>
  <text x="870" y="653" class="body">동기화 → pending_d 접수와 같은 cycle에 선택 → 출력</text>
  <text x="870" y="689" class="small">기존 pending storage와 round-robin을 유지하면서 신규 event의 service latency만 감소</text>
</svg>
