<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" role="img" aria-labelledby="title desc">
  <title id="title">P3 개선 AER 컨트롤러 구조</title>
  <desc id="desc">16개 뉴런의 비동기 요청을 두 단계로 안정화하고, 뉴런마다 한 이벤트를 보관한 뒤, 순번을 돌려가며 하나의 4비트 주소 버스로 내보내는 P3 구조</desc>

  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-back" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#0f766e"/>
    </marker>
    <filter id="shadow" x="-12%" y="-16%" width="124%" height="136%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px 'Noto Sans KR', 'Malgun Gothic', sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px 'Noto Sans KR', 'Malgun Gothic', sans-serif; fill: #475569; }
      .block-title { font: 700 20px 'Noto Sans KR', 'Malgun Gothic', sans-serif; fill: #0f172a; }
      .body { font: 400 16px 'Noto Sans KR', 'Malgun Gothic', sans-serif; fill: #334155; }
      .small { font: 400 14px 'Noto Sans KR', 'Malgun Gothic', sans-serif; fill: #475569; }
      .signal { font: 700 15px Consolas, 'Noto Sans KR', monospace; fill: #0f172a; }
      .flow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .return { stroke: #0f766e; stroke-width: 3; fill: none; marker-end: url(#arrow-back); }
      .thin { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="1500" height="860" fill="#f8fafc"/>
  <text x="60" y="58" class="title">P3 개선 AER 컨트롤러</text>
  <text x="60" y="90" class="subtitle">비동기 요청을 안전하게 받아 잠시 보관하고, 순번대로 하나의 주소 통로에 연속 전송</text>

  <!-- Source block -->
  <g filter="url(#shadow)">
    <rect x="50" y="210" width="220" height="330" rx="20" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  </g>
  <text x="160" y="250" text-anchor="middle" class="block-title">뉴런 16개</text>
  <text x="160" y="278" text-anchor="middle" class="small">각자 원하는 순간에 발화</text>
  <rect x="82" y="315" width="156" height="50" rx="10" fill="#ffffff" stroke="#5eead4"/>
  <rect x="82" y="382" width="156" height="50" rx="10" fill="#ffffff" stroke="#5eead4"/>
  <rect x="82" y="458" width="156" height="50" rx="10" fill="#ffffff" stroke="#5eead4"/>
  <text x="160" y="346" text-anchor="middle" class="body">source 0</text>
  <text x="160" y="413" text-anchor="middle" class="body">source 1</text>
  <text x="160" y="449" text-anchor="middle" class="block-title">⋮</text>
  <text x="160" y="489" text-anchor="middle" class="body">source 15</text>

  <!-- CDC block -->
  <g filter="url(#shadow)">
    <rect x="330" y="250" width="190" height="250" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  </g>
  <text x="425" y="290" text-anchor="middle" class="block-title">입구 안정화</text>
  <text x="425" y="319" text-anchor="middle" class="small">두 단계 동기화</text>
  <rect x="370" y="350" width="46" height="58" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <rect x="436" y="350" width="46" height="58" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="393" y="385" text-anchor="middle" class="signal">FF1</text>
  <text x="459" y="385" text-anchor="middle" class="signal">FF2</text>
  <path d="M416 379 H430" class="flow"/>
  <text x="425" y="445" text-anchor="middle" class="body">서로 다른 시간 기준의</text>
  <text x="425" y="469" text-anchor="middle" class="body">신호를 안전하게 인계</text>

  <!-- Pending slots -->
  <g filter="url(#shadow)">
    <rect x="580" y="250" width="200" height="250" rx="18" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  </g>
  <text x="680" y="290" text-anchor="middle" class="block-title">이벤트 대기칸</text>
  <text x="680" y="319" text-anchor="middle" class="small">뉴런마다 1칸 · 총 16칸</text>
  <g fill="#ffffff" stroke="#5eead4">
    <rect x="614" y="350" width="32" height="32" rx="6"/>
    <rect x="654" y="350" width="32" height="32" rx="6"/>
    <rect x="694" y="350" width="32" height="32" rx="6"/>
    <rect x="734" y="350" width="32" height="32" rx="6"/>
    <rect x="614" y="392" width="32" height="32" rx="6"/>
    <rect x="654" y="392" width="32" height="32" rx="6"/>
    <rect x="694" y="392" width="32" height="32" rx="6"/>
    <rect x="734" y="392" width="32" height="32" rx="6"/>
  </g>
  <text x="680" y="453" text-anchor="middle" class="body">동시에 온 요청과</text>
  <text x="680" y="477" text-anchor="middle" class="body">수신기 지연을 흡수</text>

  <!-- Round robin -->
  <g filter="url(#shadow)">
    <rect x="840" y="225" width="220" height="300" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  </g>
  <text x="950" y="265" text-anchor="middle" class="block-title">돌아가며 선택</text>
  <text x="950" y="294" text-anchor="middle" class="small">4개 그룹 × 그룹당 4개 뉴런</text>
  <circle cx="950" cy="385" r="66" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
  <text x="950" y="365" text-anchor="middle" class="signal">0 → 1 → 2 → 3</text>
  <text x="950" y="394" text-anchor="middle" class="body">마지막 처리 위치의</text>
  <text x="950" y="418" text-anchor="middle" class="body">다음부터 다시 확인</text>
  <path d="M915 444 C875 415 875 350 915 324" fill="none" stroke="#f97316" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="950" y="486" text-anchor="middle" class="body">특정 뉴런의 독점 방지</text>

  <!-- Output -->
  <g filter="url(#shadow)">
    <rect x="1120" y="250" width="160" height="250" rx="18" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  </g>
  <text x="1200" y="290" text-anchor="middle" class="block-title">출력 대기칸</text>
  <text x="1200" y="319" text-anchor="middle" class="small">주소 1개를 안정적으로 유지</text>
  <rect x="1150" y="350" width="100" height="72" rx="10" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="1200" y="379" text-anchor="middle" class="signal">addr[3:0]</text>
  <text x="1200" y="405" text-anchor="middle" class="signal">valid</text>
  <text x="1200" y="458" text-anchor="middle" class="body">수신 준비 시</text>
  <text x="1200" y="482" text-anchor="middle" class="body">매 clock 1개 전송</text>

  <!-- Receiver -->
  <g filter="url(#shadow)">
    <rect x="1340" y="285" width="120" height="180" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  </g>
  <text x="1400" y="330" text-anchor="middle" class="block-title">수신기</text>
  <text x="1400" y="363" text-anchor="middle" class="small">주소 사용</text>
  <rect x="1363" y="390" width="74" height="42" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="1400" y="416" text-anchor="middle" class="signal">ready</text>

  <!-- Main signal arrows -->
  <path d="M270 350 H315" class="flow"/>
  <path d="M520 350 H565" class="flow"/>
  <path d="M780 350 H825" class="flow"/>
  <path d="M1060 350 H1105" class="flow"/>
  <path d="M1280 350 H1325" class="flow"/>
  <text x="292" y="330" text-anchor="middle" class="signal">req</text>
  <text x="542" y="330" text-anchor="middle" class="signal">안정화된 요청</text>
  <text x="802" y="330" text-anchor="middle" class="signal">대기 이벤트</text>
  <text x="1082" y="330" text-anchor="middle" class="signal">선택 주소</text>
  <text x="1302" y="330" text-anchor="middle" class="signal">4-bit</text>

  <!-- Acknowledge and backpressure -->
  <path d="M1280 535 H330 V560 H270" class="return"/>
  <text x="775" y="557" text-anchor="middle" class="signal">수신기 지연과 대기칸 상태를 뉴런에 되돌려 알림</text>

  <!-- Improvement cards -->
  <text x="60" y="660" class="block-title">T0와 비교해 무엇이 달라졌나?</text>
  <rect x="55" y="690" width="325" height="115" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="405" y="690" width="325" height="115" rx="14" fill="#ecfdf5" stroke="#6ee7b7"/>
  <rect x="755" y="690" width="325" height="115" rx="14" fill="#fff7ed" stroke="#fdba74"/>
  <rect x="1105" y="690" width="340" height="115" rx="14" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="217" y="727" text-anchor="middle" class="block-title">안전한 입구</text>
  <text x="217" y="756" text-anchor="middle" class="body">제각각 도착하는 요청을</text>
  <text x="217" y="780" text-anchor="middle" class="body">내부 clock 기준으로 안정화</text>
  <text x="567" y="727" text-anchor="middle" class="block-title">요청 보관</text>
  <text x="567" y="756" text-anchor="middle" class="body">뉴런마다 이벤트 1개를 기억해</text>
  <text x="567" y="780" text-anchor="middle" class="body">동시 요청의 손실 방지</text>
  <text x="917" y="727" text-anchor="middle" class="block-title">공정한 순서</text>
  <text x="917" y="756" text-anchor="middle" class="body">처리 순번을 계속 옮겨</text>
  <text x="917" y="780" text-anchor="middle" class="body">한 뉴런의 통로 독점 방지</text>
  <text x="1275" y="727" text-anchor="middle" class="block-title">끊김 없는 출력</text>
  <text x="1275" y="756" text-anchor="middle" class="body">수신기가 준비되어 있으면</text>
  <text x="1275" y="780" text-anchor="middle" class="body">매 clock마다 이벤트 1개 전달</text>
</svg>
