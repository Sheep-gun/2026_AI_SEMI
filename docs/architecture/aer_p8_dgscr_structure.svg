<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">P8-DG-SCR AER 컨트롤러 구조</title>
  <desc id="desc">16개 비동기 source의 요청을 resetless 2FF CDC로 동기화하고, pending 16개와 Early ACK로 접수한 뒤 direct Gray epoch와 공유형 균형 OR 트리 중재기로 공정하게 선택하여 등록된 단일 4-bit 주소 버스로 전달하는 구조와 reset 분할</desc>

  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-violet" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#7c3aed"/>
    </marker>
    <filter id="shadow" x="-14%" y="-16%" width="128%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font:700 32px 'Noto Sans KR','Malgun Gothic',sans-serif; fill:#0f172a; }
      .subtitle { font:400 17px 'Noto Sans KR','Malgun Gothic',sans-serif; fill:#475569; }
      .block-title { font:700 20px 'Noto Sans KR','Malgun Gothic',sans-serif; fill:#0f172a; }
      .card-title { font:700 17px 'Noto Sans KR','Malgun Gothic',sans-serif; fill:#0f172a; }
      .body { font:400 15px 'Noto Sans KR','Malgun Gothic',sans-serif; fill:#334155; }
      .small { font:400 13px 'Noto Sans KR','Malgun Gothic',sans-serif; fill:#475569; }
      .signal { font:700 14px Consolas,'Noto Sans KR',monospace; fill:#0f172a; }
      .flow { stroke:#2563eb; stroke-width:3; fill:none; marker-end:url(#arrow-blue); }
      .ack { stroke:#0f766e; stroke-width:3; fill:none; marker-end:url(#arrow-teal); }
      .state { stroke:#ea580c; stroke-width:3; fill:none; marker-end:url(#arrow-orange); }
      .feedback { stroke:#7c3aed; stroke-width:2.5; stroke-dasharray:8 6; fill:none; marker-end:url(#arrow-violet); }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f8fafc"/>

  <!-- Header -->
  <text x="48" y="55" class="title">P8-DG-SCR: 직접 Gray · 동기 Core Reset AER 컨트롤러</text>
  <text x="48" y="88" class="subtitle">비동기 이벤트를 안전하게 접수하고, 중복 논리와 reset 부담을 줄여 단일 주소 버스로 전달</text>
  <rect x="1170" y="26" width="382" height="68" rx="14" fill="#eef2ff" stroke="#818cf8"/>
  <text x="1361" y="52" text-anchor="middle" class="card-title">PPA 개선의 세 축</text>
  <text x="1361" y="78" text-anchor="middle" class="small">reset fanout 감소 · OR 논리 공유 · Gray 전환 최소화</text>

  <!-- Stage labels -->
  <text x="48" y="132" class="small">요청 접수</text>
  <line x1="48" y1="142" x2="742" y2="142" stroke="#cbd5e1"/>
  <text x="790" y="132" class="small">선택</text>
  <line x1="790" y1="142" x2="1110" y2="142" stroke="#cbd5e1"/>
  <text x="1155" y="132" class="small">전송</text>
  <line x1="1155" y1="142" x2="1554" y2="142" stroke="#cbd5e1"/>

  <!-- 1. Asynchronous sources -->
  <g filter="url(#shadow)">
    <rect x="40" y="175" width="180" height="370" rx="20" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  </g>
  <text x="130" y="214" text-anchor="middle" class="block-title">비동기 source 16개</text>
  <text x="130" y="242" text-anchor="middle" class="small">서로 다른 시점에 발화</text>
  <rect x="68" y="274" width="124" height="46" rx="9" fill="#fff" stroke="#5eead4"/>
  <rect x="68" y="336" width="124" height="46" rx="9" fill="#fff" stroke="#5eead4"/>
  <rect x="68" y="430" width="124" height="46" rx="9" fill="#fff" stroke="#5eead4"/>
  <text x="130" y="303" text-anchor="middle" class="signal">source 0</text>
  <text x="130" y="365" text-anchor="middle" class="signal">source 1</text>
  <text x="130" y="409" text-anchor="middle" class="block-title">⋮</text>
  <text x="130" y="459" text-anchor="middle" class="signal">source 15</text>
  <text x="130" y="505" text-anchor="middle" class="small">4-phase REQ / ACK</text>
  <text x="130" y="527" text-anchor="middle" class="small">ACK까지 REQ 유지</text>

  <!-- 2. Resetless synchronizers -->
  <g filter="url(#shadow)">
    <rect x="265" y="220" width="180" height="260" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  </g>
  <text x="355" y="258" text-anchor="middle" class="block-title">Resetless 2FF CDC</text>
  <text x="355" y="285" text-anchor="middle" class="small">16 lane × 2단 = 32 FF</text>
  <rect x="292" y="316" width="55" height="62" rx="9" fill="#fff" stroke="#93c5fd"/>
  <rect x="365" y="316" width="55" height="62" rx="9" fill="#fff" stroke="#93c5fd"/>
  <text x="319" y="352" text-anchor="middle" class="signal">FF1</text>
  <text x="392" y="352" text-anchor="middle" class="signal">FF2</text>
  <path d="M347 347 H357" class="flow"/>
  <text x="355" y="414" text-anchor="middle" class="body">비동기 REQ를 2번 샘플링</text>
  <text x="355" y="440" text-anchor="middle" class="small">메타안정성의 내부 전파 확률을 낮춤</text>
  <text x="355" y="462" text-anchor="middle" class="small">reset pin 없이 계속 입력 관찰</text>

  <!-- 3. Pending store and Early ACK -->
  <g filter="url(#shadow)">
    <rect x="495" y="180" width="245" height="345" rx="18" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  </g>
  <text x="617" y="219" text-anchor="middle" class="block-title">Pending 16 + Early ACK</text>
  <text x="617" y="247" text-anchor="middle" class="small">source마다 1개의 내부 대기칸</text>
  <g fill="#fff" stroke="#5eead4">
    <rect x="545" y="280" width="28" height="28" rx="5"/><rect x="584" y="280" width="28" height="28" rx="5"/><rect x="623" y="280" width="28" height="28" rx="5"/><rect x="662" y="280" width="28" height="28" rx="5"/>
    <rect x="545" y="319" width="28" height="28" rx="5"/><rect x="584" y="319" width="28" height="28" rx="5"/><rect x="623" y="319" width="28" height="28" rx="5"/><rect x="662" y="319" width="28" height="28" rx="5"/>
    <rect x="545" y="358" width="28" height="28" rx="5"/><rect x="584" y="358" width="28" height="28" rx="5"/><rect x="623" y="358" width="28" height="28" rx="5"/><rect x="662" y="358" width="28" height="28" rx="5"/>
    <rect x="545" y="397" width="28" height="28" rx="5"/><rect x="584" y="397" width="28" height="28" rx="5"/><rect x="623" y="397" width="28" height="28" rx="5"/><rect x="662" y="397" width="28" height="28" rx="5"/>
  </g>
  <text x="617" y="463" text-anchor="middle" class="body">동기화된 요청을 즉시 기록</text>
  <text x="617" y="489" text-anchor="middle" class="small">접수한 같은 decision부터 선택 후보</text>
  <text x="617" y="511" text-anchor="middle" class="small">대기칸 확보 즉시 source에 ACK</text>

  <!-- 4. Shared balanced OR-tree arbiter -->
  <g filter="url(#shadow)">
    <rect x="790" y="155" width="320" height="405" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  </g>
  <text x="950" y="194" text-anchor="middle" class="block-title">공유형 균형 OR 트리</text>
  <text x="950" y="220" text-anchor="middle" class="body">중재기: 요청 16개 중 1개 선택</text>
  <g fill="#fff" stroke="#fb923c" stroke-width="1.7">
    <rect x="835" y="248" width="230" height="42" rx="10"/>
    <rect x="850" y="312" width="200" height="42" rx="10"/>
    <rect x="865" y="376" width="170" height="42" rx="10"/>
    <rect x="880" y="440" width="140" height="42" rx="10"/>
  </g>
  <text x="950" y="275" text-anchor="middle" class="body">16 candidate → pair valid 8</text>
  <text x="950" y="339" text-anchor="middle" class="body">8 → quarter valid 4</text>
  <text x="950" y="403" text-anchor="middle" class="body">4 → half valid 2</text>
  <text x="950" y="467" text-anchor="middle" class="body">2 → grant_valid 1</text>
  <path d="M950 290 V302" class="state"/>
  <path d="M950 354 V366" class="state"/>
  <path d="M950 418 V430" class="state"/>
  <text x="950" y="514" text-anchor="middle" class="small">한 번 만든 valid를 유효검사와</text>
  <text x="950" y="537" text-anchor="middle" class="small">Gray 선호 branch 선택에 함께 사용</text>

  <!-- 5. Registered output -->
  <g filter="url(#shadow)">
    <rect x="1160" y="220" width="190" height="270" rx="18" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  </g>
  <text x="1255" y="259" text-anchor="middle" class="block-title">등록된 출력</text>
  <rect x="1192" y="299" width="126" height="88" rx="10" fill="#fff" stroke="#a5b4fc"/>
  <text x="1255" y="331" text-anchor="middle" class="signal">out_addr_q[3:0]</text>
  <text x="1255" y="360" text-anchor="middle" class="signal">out_valid_q</text>
  <text x="1255" y="420" text-anchor="middle" class="body">addr / valid를 FF에 저장</text>
  <text x="1255" y="448" text-anchor="middle" class="small">ready=0이면 출력 그대로 유지</text>
  <text x="1255" y="470" text-anchor="middle" class="small">stall 중 event 유실 없음</text>

  <!-- 6. Receiver -->
  <g filter="url(#shadow)">
    <rect x="1400" y="245" width="160" height="220" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  </g>
  <text x="1480" y="284" text-anchor="middle" class="block-title">수신기</text>
  <rect x="1421" y="314" width="118" height="64" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="1480" y="341" text-anchor="middle" class="signal">4-bit 주소</text>
  <text x="1480" y="363" text-anchor="middle" class="small">버스 1개</text>
  <text x="1480" y="414" text-anchor="middle" class="body">최대 1 event</text>
  <text x="1480" y="439" text-anchor="middle" class="body">/ clock</text>

  <!-- Forward datapath arrows, placed only in the inter-block gaps. -->
  <path d="M220 347 H250" class="flow"/>
  <path d="M445 347 H480" class="flow"/>
  <path d="M740 347 H775" class="flow"/>
  <path d="M1110 347 H1145" class="flow"/>
  <path d="M1350 347 H1385" class="flow"/>
  <text x="235" y="326" text-anchor="middle" class="signal">REQ</text>
  <text x="462" y="326" text-anchor="middle" class="signal">sync</text>
  <text x="757" y="326" text-anchor="middle" class="signal">pending</text>
  <text x="1127" y="326" text-anchor="middle" class="signal">winner</text>
  <text x="1367" y="316" text-anchor="middle" class="signal">1×4-bit</text>

  <!-- Early ACK return path. -->
  <path d="M617 525 V610 H130 V560" class="ack"/>
  <text x="374" y="576" text-anchor="middle" class="card-title">Early ACK</text>
  <text x="374" y="599" text-anchor="middle" class="small">출력 완료를 기다리지 않고 pending 접수 직후 source를 해제</text>

  <!-- Receiver backpressure. -->
  <path d="M1480 465 V540 H1255 V505" class="feedback"/>
  <text x="1370" y="530" text-anchor="middle" class="small">ready / stall 피드백</text>

  <!-- Direct Gray state and fairness contract. -->
  <g filter="url(#shadow)">
    <rect x="805" y="600" width="305" height="125" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  </g>
  <text x="957" y="636" text-anchor="middle" class="block-title">Direct Gray epoch 4 FF</text>
  <text x="957" y="665" text-anchor="middle" class="body">다음 우선순위를 Gray 상태로 직접 저장</text>
  <text x="957" y="691" text-anchor="middle" class="small">service decision마다 1 bit만 바뀌며 16주소 순환</text>
  <text x="957" y="713" text-anchor="middle" class="small">binary→Gray 변환 상태와 중복 switching 제거</text>
  <path d="M885 600 V574" class="state"/>
  <path d="M1030 560 V590" class="state"/>
  <text x="866" y="586" text-anchor="end" class="small">선호 branch</text>
  <text x="1042" y="586" class="small">grant</text>

  <g filter="url(#shadow)">
    <rect x="1150" y="585" width="410" height="140" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <text x="1355" y="621" text-anchor="middle" class="block-title">처리율과 공정성 보장</text>
  <text x="1180" y="654" class="body">• 출력이 비면 같은 clock에 다음 event를 채움</text>
  <text x="1180" y="682" class="body">• 지속 pending 요청: 최대 16 service decisions 안에 선택</text>
  <text x="1180" y="708" class="small">※ receiver stall 시간은 service decision 횟수에서 제외</text>

  <!-- Reset partition -->
  <rect x="40" y="758" width="1520" height="208" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="70" y="793" class="block-title">Reset partition: 꼭 필요한 상태만 비동기 reset, 나머지는 동기 clear 또는 resetless</text>

  <rect x="70" y="814" width="290" height="125" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="215" y="846" text-anchor="middle" class="card-title">reset_release 2 FF</text>
  <text x="215" y="874" text-anchor="middle" class="body">유일한 async-reset FF</text>
  <text x="215" y="900" text-anchor="middle" class="small">assert 즉시 0 · deassert 뒤 2 clock</text>
  <text x="215" y="922" text-anchor="middle" class="small">core_rst_n을 안전하게 생성</text>

  <rect x="390" y="814" width="330" height="125" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="555" y="846" text-anchor="middle" class="card-title">Core state 37 FF</text>
  <text x="555" y="874" text-anchor="middle" class="body">ACK 16 + pending 16 + epoch 4 + valid 1</text>
  <text x="555" y="900" text-anchor="middle" class="small">core_rst_n=0인 두 clock 동안</text>
  <text x="555" y="922" text-anchor="middle" class="small">일반 DFF에서 synchronous clear</text>

  <rect x="750" y="814" width="300" height="125" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="900" y="846" text-anchor="middle" class="card-title">Resetless 36 FF</text>
  <text x="900" y="874" text-anchor="middle" class="body">2FF CDC 32 + out_addr 4</text>
  <text x="900" y="900" text-anchor="middle" class="small">reset pin과 reset 배선 없음</text>
  <text x="900" y="922" text-anchor="middle" class="small">CDC는 reset 중에도 입력을 계속 샘플링</text>

  <rect x="1080" y="814" width="450" height="125" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="1305" y="846" text-anchor="middle" class="card-title">ACK / valid 출력 isolation</text>
  <text x="1305" y="874" text-anchor="middle" class="body">core_rst_n=0이면 clock과 무관하게 ACK=0, valid=0</text>
  <text x="1305" y="900" text-anchor="middle" class="small">비동기 reset assert 때 외부 제어 출력은 즉시 안전 상태</text>
  <text x="1305" y="922" text-anchor="middle" class="small">valid=0인 동안 out_addr 값은 무효(don't-care)</text>
</svg>
