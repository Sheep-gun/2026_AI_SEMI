<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">전통형 AER, GRR AER, OHT AER 최종 PPA 비교</title>
  <desc id="desc">GPDK45 post-route에서 전통형 AER, GRR AER, OHT AER의 인스턴스 수, 셀 면적, 전력, 타이밍과 기능을 비교한 표</desc>

  <rect x="0" y="0" width="1600" height="900" fill="#f8fafc"/>
  <text x="65" y="62" font-family="Malgun Gothic, Arial, sans-serif" font-size="34" font-weight="700" fill="#102a43">최종 PPA 비교: 전통형 AER vs GRR AER vs OHT AER</text>
  <text x="65" y="100" font-family="Malgun Gothic, Arial, sans-serif" font-size="18" font-weight="400" fill="#486581">Generic GPDK045/GSCLIB045 post-route · 개선형 10 ns clock · 전통형은 기능이 다른 최소 baseline</text>

  <!-- Header -->
  <rect x="50" y="135" width="290" height="78" fill="#1e2c4f" stroke="#d3dbe5" stroke-width="1.5"/>
  <rect x="340" y="135" width="390" height="78" fill="#8a94a3" stroke="#d3dbe5" stroke-width="1.5"/>
  <rect x="730" y="135" width="410" height="78" fill="#10a57e" stroke="#d3dbe5" stroke-width="1.5"/>
  <rect x="1140" y="135" width="410" height="78" fill="#2f61e9" stroke="#d3dbe5" stroke-width="1.5"/>
  <text x="195" y="184" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">항목</text>
  <text x="535" y="184" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">전통형 AER</text>
  <text x="935" y="184" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">GRR AER</text>
  <text x="1345" y="184" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">OHT AER</text>

  <!-- Row 1 -->
  <rect x="50" y="213" width="290" height="70" fill="#eef2f5" stroke="#d3dbe5" stroke-width="1.5"/>
  <rect x="340" y="213" width="390" height="70" fill="#f1f4f7" stroke="#d3dbe5" stroke-width="1.5"/>
  <rect x="730" y="213" width="410" height="70" fill="#ffffff" stroke="#d3dbe5" stroke-width="1.5"/>
  <rect x="1140" y="213" width="410" height="70" fill="#f7f9fb" stroke="#d3dbe5" stroke-width="1.5"/>
  <text x="72" y="256" font-family="Malgun Gothic, Arial, sans-serif" font-size="20" font-weight="400" fill="#243b53">Instances</text>
  <text x="535" y="256" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="21" fill="#7b8794">92</text>
  <text x="935" y="256" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="21" fill="#243b53">263</text>
  <text x="1345" y="256" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="21" fill="#243b53">278</text>

  <!-- Row 2 -->
  <rect x="50" y="283" width="290" height="70" fill="#ffffff" stroke="#d3dbe5" stroke-width="1.5"/>
  <rect x="340" y="283" width="390" height="70" fill="#eef2f5" stroke="#d3dbe5" stroke-width="1.5"/>
  <rect x="730" y="283" width="410" height="70" fill="#e7f7f2" stroke="#d3dbe5" stroke-width="1.5"/>
  <rect x="1140" y="283" width="410" height="70" fill="#ffffff" stroke="#d3dbe5" stroke-width="1.5"/>
  <text x="72" y="326" font-family="Malgun Gothic, Arial, sans-serif" font-size="20" fill="#243b53">Cell area</text>
  <text x="535" y="326" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="21" fill="#7b8794">214.092 μm²</text>
  <text x="935" y="326" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="21" font-weight="700" fill="#00a57e">669.294 μm²</text>
  <text x="1345" y="326" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="21" fill="#243b53">709.308 μm²</text>

  <!-- Row 3 -->
  <rect x="50" y="353" width="290" height="70" fill="#eef2f5" stroke="#d3dbe5" stroke-width="1.5"/>
  <rect x="340" y="353" width="390" height="70" fill="#f1f4f7" stroke="#d3dbe5" stroke-width="1.5"/>
  <rect x="730" y="353" width="410" height="70" fill="#ffffff" stroke="#d3dbe5" stroke-width="1.5"/>
  <rect x="1140" y="353" width="410" height="70" fill="#eaf0ff" stroke="#d3dbe5" stroke-width="1.5"/>
  <text x="72" y="396" font-family="Malgun Gothic, Arial, sans-serif" font-size="20" fill="#243b53">Vectorless power</text>
  <text x="535" y="396" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="21" fill="#7b8794">2.127 μW</text>
  <text x="935" y="396" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="21" fill="#243b53">20.641 μW</text>
  <text x="1345" y="396" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="21" font-weight="700" fill="#2f61e9">19.218 μW</text>

  <!-- Row 4 -->
  <rect x="50" y="423" width="290" height="70" fill="#ffffff" stroke="#d3dbe5" stroke-width="1.5"/>
  <rect x="340" y="423" width="390" height="70" fill="#eef2f5" stroke="#d3dbe5" stroke-width="1.5"/>
  <rect x="730" y="423" width="410" height="70" fill="#f7f9fb" stroke="#d3dbe5" stroke-width="1.5"/>
  <rect x="1140" y="423" width="410" height="70" fill="#eaf0ff" stroke="#d3dbe5" stroke-width="1.5"/>
  <text x="72" y="466" font-family="Malgun Gothic, Arial, sans-serif" font-size="20" fill="#243b53">Mapped-SAIF power</text>
  <text x="535" y="466" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="21" fill="#7b8794">미산출*</text>
  <text x="935" y="466" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="21" fill="#243b53">14.382 μW</text>
  <text x="1345" y="466" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="21" font-weight="700" fill="#2f61e9">13.780 μW</text>

  <!-- Row 5 -->
  <rect x="50" y="493" width="290" height="78" fill="#eef2f5" stroke="#d3dbe5" stroke-width="1.5"/>
  <rect x="340" y="493" width="390" height="78" fill="#f1f4f7" stroke="#d3dbe5" stroke-width="1.5"/>
  <rect x="730" y="493" width="410" height="78" fill="#ffffff" stroke="#d3dbe5" stroke-width="1.5"/>
  <rect x="1140" y="493" width="410" height="78" fill="#eaf0ff" stroke="#d3dbe5" stroke-width="1.5"/>
  <text x="72" y="540" font-family="Malgun Gothic, Arial, sans-serif" font-size="20" fill="#243b53">Core arrival / setup slack</text>
  <text x="535" y="526" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="19" fill="#7b8794">적용 불가</text>
  <text x="535" y="552" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="16" fill="#7b8794">clockless</text>
  <text x="935" y="540" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="20" fill="#243b53">2.807 ns / +6.824 ns</text>
  <text x="1345" y="540" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="20" font-weight="700" fill="#2f61e9">2.159 ns / +7.555 ns</text>

  <!-- Row 6 -->
  <rect x="50" y="571" width="290" height="70" fill="#ffffff" stroke="#d3dbe5" stroke-width="1.5"/>
  <rect x="340" y="571" width="390" height="70" fill="#eef2f5" stroke="#d3dbe5" stroke-width="1.5"/>
  <rect x="730" y="571" width="410" height="70" fill="#f7f9fb" stroke="#d3dbe5" stroke-width="1.5"/>
  <rect x="1140" y="571" width="410" height="70" fill="#ffffff" stroke="#d3dbe5" stroke-width="1.5"/>
  <text x="72" y="614" font-family="Malgun Gothic, Arial, sans-serif" font-size="20" fill="#243b53">Event 저장</text>
  <text x="535" y="614" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="20" fill="#7b8794">Pending 없음</text>
  <text x="935" y="614" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="20" fill="#243b53">최대 17개</text>
  <text x="1345" y="614" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="20" fill="#243b53">최대 17개</text>

  <!-- Row 7 -->
  <rect x="50" y="641" width="290" height="70" fill="#eef2f5" stroke="#d3dbe5" stroke-width="1.5"/>
  <rect x="340" y="641" width="390" height="70" fill="#f1f4f7" stroke="#d3dbe5" stroke-width="1.5"/>
  <rect x="730" y="641" width="410" height="70" fill="#ffffff" stroke="#d3dbe5" stroke-width="1.5"/>
  <rect x="1140" y="641" width="410" height="70" fill="#f7f9fb" stroke="#d3dbe5" stroke-width="1.5"/>
  <text x="72" y="684" font-family="Malgun Gothic, Arial, sans-serif" font-size="20" fill="#243b53">지속 요청 처리 상한</text>
  <text x="535" y="684" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="20" fill="#7b8794">없음</text>
  <text x="935" y="684" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="20" fill="#243b53">≤16 services</text>
  <text x="1345" y="684" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="20" fill="#243b53">≤16 services</text>

  <!-- Conclusion -->
  <rect x="50" y="744" width="1500" height="112" rx="18" fill="#eef4ff" stroke="#2f61e9" stroke-width="2"/>
  <text x="78" y="783" font-family="Malgun Gothic, Arial, sans-serif" font-size="22" font-weight="700" fill="#102a43">최종 해석</text>
  <text x="78" y="819" font-family="Malgun Gothic, Arial, sans-serif" font-size="18" fill="#243b53">전통형은 최소 기능 baseline, GRR은 최소 면적형, OHT는 GRR 대비 면적 +5.98%로 SAIF 전력 −4.19%와 core arrival −23.1%를 얻은 속도·전력형이다.</text>
  <text x="78" y="846" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" fill="#486581">* Cell area는 표준셀 footprint 합 · ≤16 services는 Receiver stall 제외 · 전통형은 기능·활동 조건이 달라 Mapped-SAIF 직접 비교 대상에서 제외</text>
</svg>
