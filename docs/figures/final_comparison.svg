<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">T0, P9-GRR, P9-OHT 최종 비교</title>
  <desc id="desc">세 AER 설계의 구조와 역할, 45나노미터 물리설계 결과를 한 화면에 비교</desc>
  <defs>
    <style>
      .title{font:700 34px "Malgun Gothic",sans-serif;fill:#102a43}.sub{font:18px "Malgun Gothic",sans-serif;fill:#486581}
      .head{font:700 24px "Malgun Gothic",sans-serif;fill:#102a43}.label{font:700 17px "Malgun Gothic",sans-serif;fill:#334e68}
      .text{font:16px "Malgun Gothic",sans-serif;fill:#243b53}.metric{font:700 18px "Malgun Gothic",sans-serif;fill:#102a43}
      .cell{stroke:#cbd5e1;stroke-width:1.5}.divider{stroke:#cbd5e1;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1600" height="960" fill="#f8fafc"/>
  <text x="70" y="62" class="title">최종 비교: T0 Baseline vs P9-GRR vs P9-OHT</text>
  <text x="70" y="98" class="sub">T0는 전통 구조의 기준점, GRR과 OHT는 같은 개선 기능을 서로 다른 PPA 방향으로 구현한 두 최종안</text>

  <rect x="250" y="145" width="420" height="90" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <rect x="690" y="145" width="420" height="90" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <rect x="1130" y="145" width="400" height="90" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="460" y="187" text-anchor="middle" class="head">T0 전통적 AER</text>
  <text x="460" y="218" text-anchor="middle" class="text">작고 단순한 clockless 기준점</text>
  <text x="900" y="187" text-anchor="middle" class="head">P9-GRR</text>
  <text x="900" y="218" text-anchor="middle" class="text">최소 면적의 균형형 주 설계</text>
  <text x="1330" y="187" text-anchor="middle" class="head">P9-OHT</text>
  <text x="1330" y="218" text-anchor="middle" class="text">고속·저전력 Pareto 대안</text>

  <g>
    <rect x="70" y="265" width="160" height="105" class="cell" fill="#e2e8f0"/><text x="150" y="326" text-anchor="middle" class="label">입력 처리</text>
    <rect x="250" y="265" width="420" height="105" class="cell" fill="#ffffff"/><text x="275" y="306" class="text">비동기 REQ를 중재 회로가 직접 사용</text><text x="275" y="340" class="text">동시 경합 안전성 조건이 남음</text>
    <rect x="690" y="265" width="420" height="105" class="cell" fill="#ffffff"/><text x="715" y="306" class="text">Source별 2FF로 clock 영역에 접수</text><text x="715" y="340" class="text">4-phase REQ 유지와 함께 안정성 향상</text>
    <rect x="1130" y="265" width="400" height="105" class="cell" fill="#ffffff"/><text x="1155" y="306" class="text">GRR과 동일한 Source별 2FF</text><text x="1155" y="340" class="text">같은 입력 안전성 계약</text>
  </g>
  <g>
    <rect x="70" y="370" width="160" height="105" class="cell" fill="#e2e8f0"/><text x="150" y="431" text-anchor="middle" class="label">이벤트 보관</text>
    <rect x="250" y="370" width="420" height="105" class="cell" fill="#ffffff"/><text x="275" y="411" class="text">Source별 Pending 없음</text><text x="275" y="445" class="text">수신기 정체가 source까지 전파</text>
    <rect x="690" y="370" width="420" height="105" class="cell" fill="#ffffff"/><text x="715" y="411" class="text">Pending 16 + 출력 Register 1</text><text x="715" y="445" class="text">최대 17개 보관 · Early ACK</text>
    <rect x="1130" y="370" width="400" height="105" class="cell" fill="#ffffff"/><text x="1155" y="411" class="text">GRR과 같은 17개 저장 능력</text><text x="1155" y="445" class="text">Early ACK와 stall 흡수</text>
  </g>
  <g>
    <rect x="70" y="475" width="160" height="115" class="cell" fill="#e2e8f0"/><text x="150" y="540" text-anchor="middle" class="label">중재 방식</text>
    <rect x="250" y="475" width="420" height="115" class="cell" fill="#ffffff"/><text x="275" y="516" class="text">고정 우선순위</text><text x="275" y="550" class="text">낮은 번호가 높은 번호를 굶길 수 있음</text>
    <rect x="690" y="475" width="420" height="115" class="cell" fill="#ffffff"/><text x="715" y="516" class="text">Gray-rank 4×4 grouped 순환 탐색</text><text x="715" y="550" class="text">출력 rank를 공정성 pointer로 재사용</text>
    <rect x="1130" y="475" width="400" height="115" class="cell" fill="#ffffff"/><text x="1155" y="516" class="text">별도 Gray epoch + one-hot tree</text><text x="1155" y="550" class="text">병렬 branch 선택으로 짧은 경로</text>
  </g>
  <g>
    <rect x="70" y="590" width="160" height="105" class="cell" fill="#e2e8f0"/><text x="150" y="651" text-anchor="middle" class="label">출력</text>
    <rect x="250" y="590" width="420" height="105" class="cell" fill="#ffffff"/><text x="275" y="631" class="text">비동기 4-phase 단일 주소 버스</text><text x="275" y="665" class="text">매 이벤트 return-to-zero 필요</text>
    <rect x="690" y="590" width="420" height="105" class="cell" fill="#ffffff"/><text x="715" y="631" class="text">Registered valid/ready 단일 주소 버스</text><text x="715" y="665" class="text">준비 상태에서 최대 1 event/clock</text>
    <rect x="1130" y="590" width="400" height="105" class="cell" fill="#ffffff"/><text x="1155" y="631" class="text">GRR과 같은 valid/ready 출력</text><text x="1155" y="665" class="text">stall 중 주소와 valid 고정</text>
  </g>

  <rect x="70" y="735" width="1460" height="150" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="105" y="777" class="head">GPDK45 post-route 결과</text>
  <text x="105" y="822" class="label">T0</text><text x="250" y="822" class="metric">214.092 µm² · 0.002127 mW vectorless</text>
  <text x="700" y="822" class="label">P9-GRR</text><text x="825" y="822" class="metric">669.294 µm² · 0.014382 mW SAIF</text>
  <text x="105" y="860" class="label">P9-OHT</text><text x="250" y="860" class="metric">709.308 µm² · 0.013780 mW SAIF</text>
  <text x="825" y="860" class="text">세 설계 모두 DRC 0 · Connectivity 0 · RTL-to-netlist LEC 통과</text>

  <text x="70" y="925" class="sub">주의: T0의 작은 수치는 2FF·Pending·공정성·1 event/clock 기능이 없는 최소 baseline 비용이다. 동급 PPA 승패는 GRR과 OHT끼리 비교한다.</text>
</svg>
