<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">P9 비동기 입력과 동기식 core 경계</title>
  <desc id="desc">Source 4-phase 요청이 2FF를 통과해 clock 기반 pending 중재 valid ready 출력으로 변환되는 구조</desc>
  <defs>
    <style>
      .title{font:700 34px "Malgun Gothic",sans-serif;fill:#102a43}.sub{font:18px "Malgun Gothic",sans-serif;fill:#486581}
      .h{font:700 22px "Malgun Gothic",sans-serif;fill:#102a43}.t{font:17px "Malgun Gothic",sans-serif;fill:#243b53}
      .small{font:15px "Malgun Gothic",sans-serif;fill:#486581}.box{stroke-width:2;rx:16}.arrow{fill:none;stroke:#2563eb;stroke-width:5}
      .clock{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:9 7}
    </style>
    <marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1600" height="820" fill="#f8fafc"/>
  <text x="65" y="62" class="title">P9는 비동기 source와 동기식 core를 연결한다</text>
  <text x="65" y="98" class="sub">입력은 level-held 4-phase, 내부와 receiver는 10 ns clock 기반 valid/ready</text>

  <rect x="55" y="145" width="300" height="430" rx="20" fill="#e6fffa" stroke="#0f9d8b" stroke-width="2"/>
  <text x="205" y="195" text-anchor="middle" class="h">비동기 Source 영역</text>
  <rect x="95" y="255" width="220" height="180" class="box" fill="#ffffff" stroke="#0f9d8b"/>
  <text x="205" y="305" text-anchor="middle" class="h">16개 뉴런</text>
  <text x="205" y="350" text-anchor="middle" class="t">REQ↑ · ACK↑</text>
  <text x="205" y="390" text-anchor="middle" class="t">REQ↓ · ACK↓</text>
  <text x="205" y="470" text-anchor="middle" class="small">ACK까지 REQ를 level로 유지</text>

  <rect x="405" y="145" width="300" height="430" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="555" y="195" text-anchor="middle" class="h">CDC 경계</text>
  <rect x="445" y="255" width="95" height="120" class="box" fill="#ffffff" stroke="#2563eb"/>
  <text x="492" y="305" text-anchor="middle" class="h">FF1</text><text x="492" y="345" text-anchor="middle" class="small">meta 가능</text>
  <rect x="570" y="255" width="95" height="120" class="box" fill="#ffffff" stroke="#2563eb"/>
  <text x="617" y="305" text-anchor="middle" class="h">FF2</text><text x="617" y="345" text-anchor="middle" class="small">core 입력</text>
  <path d="M540 315H570" class="arrow" marker-end="url(#blue)"/>
  <text x="555" y="430" text-anchor="middle" class="t">Source별 2FF = 32 FF</text>
  <text x="555" y="470" text-anchor="middle" class="small">확률을 0으로 만들지 않음</text>

  <rect x="755" y="145" width="500" height="430" rx="20" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="1005" y="195" text-anchor="middle" class="h">동기식 P9 Core</text>
  <rect x="800" y="255" width="190" height="180" class="box" fill="#ffffff" stroke="#10b981"/>
  <text x="895" y="305" text-anchor="middle" class="h">ACK + Pending</text>
  <text x="895" y="350" text-anchor="middle" class="t">Event 소유권 저장</text>
  <text x="895" y="392" text-anchor="middle" class="t">Early ACK</text>
  <rect x="1025" y="255" width="185" height="180" class="box" fill="#ffffff" stroke="#f97316"/>
  <text x="1117" y="305" text-anchor="middle" class="h">공정 중재</text>
  <text x="1117" y="350" text-anchor="middle" class="t">GRR 또는 OHT</text>
  <text x="1117" y="392" text-anchor="middle" class="t">≤16 services</text>
  <path d="M990 345H1025" class="arrow" marker-end="url(#blue)"/>
  <path d="M790 515H1220" class="clock"/><text x="1005" y="545" text-anchor="middle" class="t">clk = 10 ns</text>

  <rect x="1305" y="145" width="240" height="430" rx="20" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1425" y="195" text-anchor="middle" class="h">동기식 Receiver</text>
  <rect x="1340" y="255" width="170" height="180" class="box" fill="#ffffff" stroke="#7c3aed"/>
  <text x="1425" y="305" text-anchor="middle" class="h">Output Reg.</text>
  <text x="1425" y="350" text-anchor="middle" class="t">4-bit 주소 + valid</text>
  <text x="1425" y="392" text-anchor="middle" class="t">ready와 edge 전송</text>
  <path d="M1255 345H1340" class="arrow" marker-end="url(#blue)"/>

  <path d="M355 315H445" class="arrow" marker-end="url(#blue)"/>
  <path d="M665 315H800" class="arrow" marker-end="url(#blue)"/>
  <rect x="55" y="635" width="1490" height="120" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="85" y="678" class="h">Protocol 변환이 만드는 효과</text>
  <text x="85" y="718" class="t">T0의 receiver 완료 ACK를 기다리지 않고 내부 보관 뒤 source를 해제한다. Pending이 stall을 흡수하고 valid/ready 출력은 return-to-zero 없이 back-to-back 1 event/clock을 허용한다.</text>
</svg>
