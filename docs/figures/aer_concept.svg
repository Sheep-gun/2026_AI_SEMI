<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">AER의 필요성과 source 6 전송 예</title>
  <desc id="desc">16개 뉴런이 개별 주소 버스를 갖는 방식과 하나의 4비트 주소 버스를 공유하는 AER 방식 비교</desc>
  <defs>
    <style>
      .title{font:700 34px "Malgun Gothic",sans-serif;fill:#102a43}.sub{font:18px "Malgun Gothic",sans-serif;fill:#486581}
      .h{font:700 22px "Malgun Gothic",sans-serif;fill:#102a43}.t{font:17px "Malgun Gothic",sans-serif;fill:#243b53}
      .small{font:15px "Malgun Gothic",sans-serif;fill:#486581}.box{stroke-width:2;rx:16}.wire{fill:none;stroke:#94a3b8;stroke-width:3}
      .active{fill:none;stroke:#2563eb;stroke-width:5}
    </style>
    <marker id="gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#94a3b8"/></marker>
    <marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1600" height="820" fill="#f8fafc"/>
  <text x="65" y="62" class="title">왜 AER이 필요한가?</text>
  <text x="65" y="98" class="sub">뉴런마다 주소 버스를 두지 않고, 발화한 뉴런의 번호만 하나의 4-bit 공용 버스로 전달</text>

  <rect x="55" y="145" width="700" height="490" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="405" y="190" text-anchor="middle" class="h">뉴런별 전용 주소 버스</text>
  <text x="405" y="222" text-anchor="middle" class="small">16개 source가 각각 주소선과 수신 경로를 가지면 배선이 반복됨</text>
  <g>
    <rect x="100" y="275" width="145" height="65" class="box" fill="#ffffff" stroke="#f97316"/><text x="172" y="315" text-anchor="middle" class="t">뉴런 0</text>
    <rect x="100" y="365" width="145" height="65" class="box" fill="#ffffff" stroke="#f97316"/><text x="172" y="405" text-anchor="middle" class="t">뉴런 1</text>
    <rect x="100" y="455" width="145" height="65" class="box" fill="#eff6ff" stroke="#2563eb"/><text x="172" y="495" text-anchor="middle" class="h">뉴런 6 발화</text>
    <rect x="100" y="545" width="145" height="65" class="box" fill="#ffffff" stroke="#f97316"/><text x="172" y="585" text-anchor="middle" class="t">뉴런 15</text>
    <rect x="570" y="345" width="130" height="160" class="box" fill="#ffffff" stroke="#64748b"/><text x="635" y="405" text-anchor="middle" class="h">수신기</text><text x="635" y="448" text-anchor="middle" class="t">반복 배선</text>
    <path d="M245 307H570" class="wire" marker-end="url(#gray)"/><path d="M245 397H570" class="wire" marker-end="url(#gray)"/>
    <path d="M245 487H570" class="active" marker-end="url(#blue)"/><path d="M245 577H510V487H570" class="wire"/>
  </g>

  <rect x="805" y="145" width="740" height="490" rx="20" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="1175" y="190" text-anchor="middle" class="h">AER 공용 주소 버스</text>
  <text x="1175" y="222" text-anchor="middle" class="small">요청선은 source별로 받고, 선택된 번호만 4-bit로 전송</text>
  <rect x="850" y="295" width="180" height="190" class="box" fill="#ffffff" stroke="#10b981"/>
  <text x="940" y="340" text-anchor="middle" class="h">16 Sources</text>
  <text x="940" y="385" text-anchor="middle" class="t">src_req[15:0]</text>
  <text x="940" y="430" text-anchor="middle" class="h" fill="#2563eb">source 6=1</text>
  <rect x="1100" y="295" width="190" height="190" class="box" fill="#fff7ed" stroke="#f97316"/>
  <text x="1195" y="340" text-anchor="middle" class="h">AER 중재기</text>
  <text x="1195" y="385" text-anchor="middle" class="t">요청 하나 선택</text>
  <text x="1195" y="430" text-anchor="middle" class="t">주소 6 생성</text>
  <rect x="1370" y="295" width="130" height="190" class="box" fill="#eff6ff" stroke="#2563eb"/>
  <text x="1435" y="350" text-anchor="middle" class="h">수신기</text>
  <text x="1435" y="400" text-anchor="middle" class="h">0110</text>
  <text x="1435" y="445" text-anchor="middle" class="small">source ID 6</text>
  <path d="M1030 390H1100" class="active" marker-end="url(#blue)"/>
  <path d="M1290 390H1370" class="active" marker-end="url(#blue)"/>
  <text x="1330" y="370" text-anchor="middle" class="small">4-bit bus 1개</text>

  <rect x="55" y="675" width="1490" height="100" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="85" y="718" class="h">전송하는 것과 전송하지 않는 것</text>
  <text x="85" y="755" class="t">전송: 발화한 source 번호 4 bit · 미전송: 막전위, 발화 크기, timestamp. 따라서 정확한 발화 시각 순서를 복원하는 FCFS 회로가 아니다.</text>
</svg>
