<svg xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" width="1600" height="720" viewBox="0 60 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">전통형 AER과 개선형 AER의 receiver stall 파형 비교</title>
  <desc id="desc">전통형 AER의 src_req aer_req aer_ack src_ack 4단계 파형과 개선형 AER의 src_req src_ack out_valid out_ready 파형을 동일한 시간축에서 비교</desc>
  <defs>
</defs>
  <rect width="1600" height="900" fill="#fff"/>
  <g transform="translate(0,-80)">
  <text x="70" y="181" font-weight="700" font-size="23" font-family="Malgun Gothic, Arial, sans-serif" fill="#1e2c4f">전통형 AER · source와 receiver 모두 4-phase</text>
  <rect x="500" y="196" width="560" height="246" fill="#fef2f2"/>
  <text x="780" y="219" text-anchor="middle" font-weight="400" font-size="15" font-family="Malgun Gothic, Arial, sans-serif" fill="#607189">Receiver가 aer_ack를 늦추는 구간</text>
  <line x1="330" y1="230" x2="1505" y2="230" stroke="#c6d0da" stroke-width="1.5"/>
  <line x1="330" y1="285" x2="1505" y2="285" stroke="#c6d0da" stroke-width="1.5"/><line x1="330" y1="340" x2="1505" y2="340" stroke="#c6d0da" stroke-width="1.5"/><line x1="330" y1="395" x2="1505" y2="395" stroke="#c6d0da" stroke-width="1.5"/>
  <text x="78" y="266" font-weight="700" font-size="17" font-family="Consolas, Malgun Gothic, monospace" fill="#28394f">src_req[6]</text><path d="M330 270H420V240H1320V270H1505" fill="none" stroke="#286b99" stroke-width="5" stroke-linejoin="miter"/>
  <text x="78" y="321" font-weight="700" font-size="17" font-family="Consolas, Malgun Gothic, monospace" fill="#28394f">aer_req</text><path d="M330 325H500V295H1390V325H1505" fill="none" stroke="#286b99" stroke-width="5" stroke-linejoin="miter"/>
  <text x="78" y="376" font-weight="700" font-size="17" font-family="Consolas, Malgun Gothic, monospace" fill="#28394f">aer_ack</text><path d="M330 380H1060V350H1450V380H1505" fill="none" stroke="#088b94" stroke-width="5" stroke-linejoin="miter"/>
  <text x="78" y="431" font-weight="700" font-size="17" font-family="Consolas, Malgun Gothic, monospace" fill="#28394f">src_ack[6]</text><path d="M330 435H1140V405H1390V435H1505" fill="none" stroke="#088b94" stroke-width="5" stroke-linejoin="miter"/>
  <g stroke="#7f8ea1" stroke-width="2" stroke-dasharray="6 6"><line x1="420" y1="225" x2="420" y2="442"/><line x1="500" y1="225" x2="500" y2="442"/><line x1="1060" y1="225" x2="1060" y2="442"/><line x1="1140" y1="225" x2="1140" y2="442"/><line x1="1320" y1="225" x2="1320" y2="442"/><line x1="1390" y1="225" x2="1390" y2="442"/><line x1="1450" y1="225" x2="1450" y2="442"/></g>
  <text x="420" y="463" text-anchor="middle" font-weight="400" font-size="15" font-family="Malgun Gothic, Arial, sans-serif" fill="#607189">REQ↑</text><text x="500" y="483" text-anchor="middle" font-weight="400" font-size="15" font-family="Malgun Gothic, Arial, sans-serif" fill="#607189">AER REQ↑</text>
  <text x="1060" y="463" text-anchor="middle" font-weight="400" font-size="15" font-family="Malgun Gothic, Arial, sans-serif" fill="#607189">수신 ACK↑</text><text x="1140" y="483" text-anchor="middle" font-weight="400" font-size="15" font-family="Malgun Gothic, Arial, sans-serif" fill="#607189">source ACK↑</text>
  <text x="1320" y="463" text-anchor="middle" font-weight="400" font-size="15" font-family="Malgun Gothic, Arial, sans-serif" fill="#607189">REQ↓</text><text x="1390" y="483" text-anchor="middle" font-weight="400" font-size="15" font-family="Malgun Gothic, Arial, sans-serif" fill="#607189">AER REQ↓</text><text x="1450" y="463" text-anchor="middle" font-weight="400" font-size="15" font-family="Malgun Gothic, Arial, sans-serif" fill="#607189">ACK↓</text>

  <text x="70" y="535" font-weight="700" font-size="23" font-family="Malgun Gothic, Arial, sans-serif" fill="#1e2c4f">개선형 AER · source는 4-phase, receiver는 valid/ready</text>
  <rect x="570" y="550" width="500" height="246" fill="#fef2f2"/>
  <rect x="500" y="550" width="70" height="246" fill="#ecfdf5"/>
  <text x="535" y="573" text-anchor="middle" font-weight="400" font-size="15" font-family="Malgun Gothic, Arial, sans-serif" fill="#607189">저장</text><text x="820" y="573" text-anchor="middle" font-weight="400" font-size="15" font-family="Malgun Gothic, Arial, sans-serif" fill="#607189">out_ready=0이어도 output register가 event 유지</text>
  <line x1="330" y1="585" x2="1505" y2="585" stroke="#c6d0da" stroke-width="1.5"/><line x1="330" y1="640" x2="1505" y2="640" stroke="#c6d0da" stroke-width="1.5"/><line x1="330" y1="695" x2="1505" y2="695" stroke="#c6d0da" stroke-width="1.5"/><line x1="330" y1="750" x2="1505" y2="750" stroke="#c6d0da" stroke-width="1.5"/>
  <text x="78" y="621" font-weight="700" font-size="17" font-family="Consolas, Malgun Gothic, monospace" fill="#28394f">src_req[6]</text><path d="M330 625H420V595H710V625H1505" fill="none" stroke="#286b99" stroke-width="5" stroke-linejoin="miter"/>
  <text x="78" y="676" font-weight="700" font-size="17" font-family="Consolas, Malgun Gothic, monospace" fill="#28394f">src_ack[6]</text><path d="M330 680H570V650H790V680H1505" fill="none" stroke="#088b94" stroke-width="5" stroke-linejoin="miter"/>
  <text x="78" y="731" font-weight="700" font-size="17" font-family="Consolas, Malgun Gothic, monospace" fill="#28394f">out_valid</text><path d="M330 735H570V705H1180V735H1505" fill="none" stroke="#286b99" stroke-width="5" stroke-linejoin="miter"/>
  <text x="78" y="786" font-weight="700" font-size="17" font-family="Consolas, Malgun Gothic, monospace" fill="#28394f">out_ready</text><path d="M330 790H1070V760H1505" fill="none" stroke="#2c3176" stroke-width="5" stroke-linejoin="miter"/>
  <g stroke="#7f8ea1" stroke-width="2" stroke-dasharray="6 6"><line x1="420" y1="580" x2="420" y2="798"/><line x1="570" y1="580" x2="570" y2="798"/><line x1="710" y1="580" x2="710" y2="798"/><line x1="790" y1="580" x2="790" y2="798"/><line x1="1070" y1="580" x2="1070" y2="798"/><line x1="1180" y1="580" x2="1180" y2="798"/></g>
  <text x="420" y="819" text-anchor="middle" font-weight="400" font-size="15" font-family="Malgun Gothic, Arial, sans-serif" fill="#607189">REQ↑</text><text x="570" y="839" text-anchor="middle" font-weight="400" font-size="15" font-family="Malgun Gothic, Arial, sans-serif" fill="#607189">보관 + Early ACK</text>
  <text x="710" y="819" text-anchor="middle" font-weight="400" font-size="15" font-family="Malgun Gothic, Arial, sans-serif" fill="#607189">REQ↓</text><text x="790" y="839" text-anchor="middle" font-weight="400" font-size="15" font-family="Malgun Gothic, Arial, sans-serif" fill="#607189">ACK↓</text>
  <text x="1070" y="819" text-anchor="middle" font-weight="400" font-size="15" font-family="Malgun Gothic, Arial, sans-serif" fill="#607189">ready↑</text><text x="1180" y="839" text-anchor="middle" font-weight="400" font-size="15" font-family="Malgun Gothic, Arial, sans-serif" fill="#607189">clock edge에서 소비</text>
  <text x="70" y="878" font-weight="400" font-size="19" font-family="Malgun Gothic, Arial, sans-serif" fill="#52657d">Early ACK = receiver 완료가 아니라 controller 내부 보관 완료</text>
  </g>
</svg>
