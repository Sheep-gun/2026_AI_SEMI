<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">16×16 뉴런 배열에 4×4 P9 타일을 계층적으로 적용하는 구조</title>
  <desc id="desc">16개의 4×4 local tile과 각 P9 controller, 상위 tile arbiter, 8비트 global address 구성</desc>
  <defs>
    <style>
      .title{font:700 34px "Malgun Gothic",sans-serif;fill:#102a43}.sub{font:18px "Malgun Gothic",sans-serif;fill:#486581}
      .h{font:700 22px "Malgun Gothic",sans-serif;fill:#102a43}.t{font:16px "Malgun Gothic",sans-serif;fill:#243b53}
      .small{font:14px "Malgun Gothic",sans-serif;fill:#486581}.tile{stroke:#10b981;stroke-width:2}.line{fill:none;stroke:#2563eb;stroke-width:5}
    </style>
    <marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1600" height="860" fill="#f8fafc"/>
  <text x="65" y="62" class="title">2차 과제 적용: 4×4 local tile을 16×16 시스템으로 확장</text>
  <text x="65" y="98" class="sub">현재 16-source IP를 바꾸지 않고 tile ID와 상위 중재를 추가</text>

  <rect x="55" y="145" width="650" height="535" rx="20" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="380" y="190" text-anchor="middle" class="h">16×16 Neuron Sensor = 4×4 Tile 16개</text>
  <g>
    <rect x="105" y="235" width="120" height="85" rx="10" fill="#ffffff" class="tile"/><text x="165" y="270" text-anchor="middle" class="t">Tile 0</text><text x="165" y="296" text-anchor="middle" class="small">4×4 + P9</text>
    <rect x="245" y="235" width="120" height="85" rx="10" fill="#ffffff" class="tile"/><text x="305" y="270" text-anchor="middle" class="t">Tile 1</text><text x="305" y="296" text-anchor="middle" class="small">4×4 + P9</text>
    <rect x="385" y="235" width="120" height="85" rx="10" fill="#ffffff" class="tile"/><text x="445" y="270" text-anchor="middle" class="t">Tile 2</text><text x="445" y="296" text-anchor="middle" class="small">4×4 + P9</text>
    <rect x="525" y="235" width="120" height="85" rx="10" fill="#ffffff" class="tile"/><text x="585" y="270" text-anchor="middle" class="t">Tile 3</text><text x="585" y="296" text-anchor="middle" class="small">4×4 + P9</text>
    <rect x="105" y="340" width="120" height="85" rx="10" fill="#ffffff" class="tile"/><text x="165" y="375" text-anchor="middle" class="t">Tile 4</text><text x="165" y="401" text-anchor="middle" class="small">4×4 + P9</text>
    <rect x="245" y="340" width="120" height="85" rx="10" fill="#ffffff" class="tile"/><text x="305" y="375" text-anchor="middle" class="t">Tile 5</text><text x="305" y="401" text-anchor="middle" class="small">4×4 + P9</text>
    <rect x="385" y="340" width="120" height="85" rx="10" fill="#ffffff" class="tile"/><text x="445" y="375" text-anchor="middle" class="t">Tile 6</text><text x="445" y="401" text-anchor="middle" class="small">4×4 + P9</text>
    <rect x="525" y="340" width="120" height="85" rx="10" fill="#ffffff" class="tile"/><text x="585" y="375" text-anchor="middle" class="t">Tile 7</text><text x="585" y="401" text-anchor="middle" class="small">4×4 + P9</text>
    <text x="165" y="490" text-anchor="middle" class="h">⋮</text><text x="305" y="490" text-anchor="middle" class="h">⋮</text><text x="445" y="490" text-anchor="middle" class="h">⋮</text><text x="585" y="490" text-anchor="middle" class="h">⋮</text>
    <rect x="105" y="535" width="120" height="85" rx="10" fill="#ffffff" class="tile"/><text x="165" y="570" text-anchor="middle" class="t">Tile 12</text><text x="165" y="596" text-anchor="middle" class="small">4×4 + P9</text>
    <rect x="245" y="535" width="120" height="85" rx="10" fill="#ffffff" class="tile"/><text x="305" y="570" text-anchor="middle" class="t">Tile 13</text><text x="305" y="596" text-anchor="middle" class="small">4×4 + P9</text>
    <rect x="385" y="535" width="120" height="85" rx="10" fill="#ffffff" class="tile"/><text x="445" y="570" text-anchor="middle" class="t">Tile 14</text><text x="445" y="596" text-anchor="middle" class="small">4×4 + P9</text>
    <rect x="525" y="535" width="120" height="85" rx="10" fill="#ffffff" class="tile"/><text x="585" y="570" text-anchor="middle" class="t">Tile 15</text><text x="585" y="596" text-anchor="middle" class="small">4×4 + P9</text>
  </g>

  <path d="M705 410H830" class="line" marker-end="url(#blue)"/>
  <text x="767" y="390" text-anchor="middle" class="small">16 tile outputs</text>

  <rect x="835" y="260" width="300" height="300" rx="20" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="985" y="315" text-anchor="middle" class="h">상위 Tile Arbiter</text>
  <text x="985" y="365" text-anchor="middle" class="t">16개 tile 중 하나 선택</text>
  <text x="985" y="410" text-anchor="middle" class="t">Tile 간 공정성</text>
  <text x="985" y="455" text-anchor="middle" class="t">Global backpressure</text>
  <text x="985" y="505" text-anchor="middle" class="small">2차 과제에서 새로 설계·검증</text>

  <path d="M1135 410H1245" class="line" marker-end="url(#blue)"/>
  <rect x="1250" y="260" width="295" height="300" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1397" y="315" text-anchor="middle" class="h">Global Event Address</text>
  <rect x="1295" y="365" width="105" height="75" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <rect x="1400" y="365" width="105" height="75" rx="10" fill="#bbf7d0" stroke="#10b981" stroke-width="2"/>
  <text x="1347" y="397" text-anchor="middle" class="t">Tile ID</text><text x="1347" y="425" text-anchor="middle" class="small">4 bit</text>
  <text x="1452" y="397" text-anchor="middle" class="t">Local ID</text><text x="1452" y="425" text-anchor="middle" class="small">4 bit</text>
  <text x="1397" y="490" text-anchor="middle" class="h">합계 8 bit</text>
  <text x="1397" y="525" text-anchor="middle" class="small">256개 뉴런 주소</text>

  <rect x="55" y="720" width="1490" height="95" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="85" y="758" class="h">재사용과 신규 작업의 경계</text>
  <text x="85" y="792" class="t">재사용: local 16-source 2FF·Pending·중재·valid/ready · 신규: tile ID, 상위 arbiter, system traffic·PPA·global fairness 검증</text>
</svg>
